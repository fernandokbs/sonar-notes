services:
  sonarqube:
    image: sonarqube # arm64v8/sonarqube # sonarqube:26.2.0.119303-community
    ports:
      - 9000:9000
    networks:
      - ci-network
    volumes:
      - sonarqube_data:/opt/sonarqube/data
    restart: always

volumes:
  sonarqube_data:

networks:
  ci-network:
    external: true